name: Native rebuild core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record source
        run: git rev-parse HEAD
      - name: Test native core
        run: swift test --filter FluxCoreTests
