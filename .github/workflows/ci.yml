name: CI

# Builds Flux on a macOS runner (this repo is developed from a Linux box, so CI
# is the only place the app compiles), runs the headless self-test, and — on
# v* tag pushes — publishes a GitHub release with Flux.dmg attached, which is
# the artifact UpdateChecker consumes for in-app auto-update.

on:
  push:
    branches: [main, 'notch-**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      menu_bar_probe:
        description: Run the live macOS 27 visibility probe before building
        type: boolean
        default: false
      arrow_probe_only:
        description: Focus menu_bar_probe on icon moves and real arrow clicks
        type: boolean
        default: false
      drag_probe_plan:
        description: Run isolated native drag cases from exact commits instead of building
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: ci-${{ inputs.drag_probe_plan && 'native-drag-probes' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  drag-probes:
    if: ${{ inputs.drag_probe_plan }}
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run isolated native drag cases
        env:
          FLUX_DRAG_PROBE_PLAN: ${{ inputs.drag_probe_plan }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time
          from pathlib import Path
          sys.path.insert(0, 'Scripts')
          from probe_hidden_transition import run
          from probe_tcc import accessibility_grant
          plan = json.loads(os.environ['FLUX_DRAG_PROBE_PLAN'])
          assert isinstance(plan, list) and 0 < len(plan) <= 6
          assert sum(len(item['cases']) for item in plan) <= 12
          for item in plan:
              assert re.fullmatch(r'[0-9a-f]{40}', item['ref'])
              assert isinstance(item['cases'], list) and item['cases']
              assert all(re.fullmatch(r'[a-z-]+', case) for case in item['cases'])
          output = Path('build/native-drag-debug').resolve()
          output.mkdir(parents=True)
          results = []
          deadline = time.monotonic() + 480
          with accessibility_grant('com.flux.menu-drag-probe'):
              for item in plan:
                  ref = item['ref']
                  source = output / ref[:8]
                  source.mkdir()
                  archive = source / 'source.tar'
                  run(['git', 'archive', '--format=tar', '--output', str(archive), ref,
                       'Scripts', 'Sources/Flux/MenuBar/MenuBarDragController.swift',
                       'Sources/Flux/MenuBar/MenuBarSection.swift'], 15)
                  run(['tar', '-xf', str(archive), '-C', str(source)], 15)
                  for case in item['cases']:
                      if time.monotonic() + 130 > deadline:
                          raise RuntimeError('native drag plan reached its overall deadline')
                      try:
                          log = run(['python3', str(source / 'Scripts/probe_menu_drag.py'),
                                     '--output', str(source / case), '--case', case,
                                     '--seconds', '25'], 130, capture=True)
                          result = 'pass'
                      except RuntimeError as error:
                          log, result = str(error), 'fail'
                      (source / (case + '-runner.log')).write_text(log)
                      results.append(dict(ref=ref, case=case, result=result))
                      (output / 'results.json').write_text(json.dumps(results, indent=2))
                      print(ref[:8], case, result, flush=True)
          if any(item['result'] != 'pass' for item in results):
              raise SystemExit(1)
          PY
      - name: Upload isolated native drag evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-drag-debug
          path: build/native-drag-debug/
          if-no-files-found: warn

  build:
    if: ${{ !inputs.drag_probe_plan }}
    runs-on: xcode-27 # macOS 27 / Xcode 27 public-preview runner
    timeout-minutes: 30
    steps:
      # Pinned to an immutable commit SHA — see the note in codeql.yml. It
      # matters more here than there: this workflow holds `contents: write`
      # and publishes the DMG the in-app updater installs, so a repointed
      # tag could ship arbitrary code to every Flux user.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Swift version
        run: swift --version

      - name: Probe automatic update scheduling
        if: ${{ (inputs.menu_bar_probe && !inputs.arrow_probe_only) || startsWith(github.ref, 'refs/tags/v') }}
        run: python3 Scripts/probe_schedule.py

      - name: Probe sound keys after access recovery
        if: ${{ (inputs.menu_bar_probe && !inputs.arrow_probe_only) || startsWith(github.ref, 'refs/tags/v') }}
        run: python3 Scripts/probe_sound.py

      - name: Reproduce the previous automatic update failure
        if: ${{ (inputs.menu_bar_probe && !inputs.arrow_probe_only) || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'Scripts')
          from probe_update import run
          result = run(['python3', 'Scripts/probe_update.py', '--baseline-ref',
                        '355d3f1674403b5388180f7087bfca5a27a9493f', '--case', 'overlap'],
                       seconds=180, check=False)
          print(result.stdout)
          assert result.returncode == 1 and 'manual refresh suppressed the background install' in result.stdout
          print('PASS: the previous updater reproduces the reported manual-update failure')
          PY

      - name: Probe automatic update and rollback
        if: ${{ (inputs.menu_bar_probe && !inputs.arrow_probe_only) || startsWith(github.ref, 'refs/tags/v') }}
        run: python3 Scripts/probe_update.py

      - name: Probe Settings icon section moves
        if: ${{ inputs.menu_bar_probe || startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'Scripts')
          from probe_update import run
          result = run(['python3', 'Scripts/probe_icons.py', '--native-close',
                        '--manager-ref', '0bcc1bd270569beb7c763038991021af1b5b80c9'],
                       seconds=180, check=False)
          print(result.stdout)
          assert result.returncode == 1
          assert 'native Command changed Hidden to Shown after delivered mouse-up' in result.stdout
          assert 'Closed management' in result.stdout
          assert 'native Command move to Shown did not persist' in result.stdout
          print('PASS: the previous manager loses the completed native section edit')
          run(['python3', 'Scripts/probe_icons.py', '--native-close'], seconds=180)
          PY

      - name: Probe menu bar layout reads
        if: ${{ inputs.menu_bar_probe || startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 3
        run: python3 Scripts/probe_layout_scan.py

      - name: Probe Always Hidden transitions
        if: ${{ (inputs.menu_bar_probe && !inputs.arrow_probe_only) || startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 5
        run: python3 Scripts/probe_hidden_transition.py --install-normal-fixture

      - name: Probe native icon dragging and Command bypass
        if: ${{ (inputs.menu_bar_probe && !inputs.arrow_probe_only) || startsWith(github.ref, 'refs/tags/v') }}
        timeout-minutes: 9
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'Scripts')
          from probe_hidden_transition import run
          from probe_tcc import accessibility_grant
          with accessibility_grant('com.flux.menu-drag-probe'):
              run(['python3', 'Scripts/probe_menu_drag.py', '--output',
                   'build/menu-drag-probe-busy', '--seconds', '25', '--busy-only'], 130)
              run(['python3', 'Scripts/probe_menu_drag.py', '--output',
                   'build/menu-drag-probe', '--seconds', '55'], 170)
              run(['python3', 'Scripts/probe_menu_drag.py', '--output',
                   'build/menu-drag-probe-empty-title', '--seconds', '55', '--empty-title'], 170)
          PY

      - name: Upload native drag probe logs
        if: ${{ always() && ((inputs.menu_bar_probe && !inputs.arrow_probe_only) || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: menu-drag-probe
          path: build/menu-drag-probe*/
          if-no-files-found: warn

      - name: Import release signing identity
        env:
          FLUX_SIGNING_P12: ${{ secrets.FLUX_SIGNING_P12 }}
          FLUX_SIGNING_PASSWORD: ${{ secrets.FLUX_SIGNING_PASSWORD }}
        run: python3 Scripts/import_signing.py

      - name: Probe access across changed signed builds
        if: ${{ (inputs.menu_bar_probe && !inputs.arrow_probe_only) || startsWith(github.ref, 'refs/tags/v') }}
        run: python3 Scripts/probe_signing.py

      - name: Probe menu bar visibility
        if: ${{ (inputs.menu_bar_probe && !inputs.arrow_probe_only) || startsWith(github.ref, 'refs/tags/v') }}
        run: python3 Scripts/probe_menu_bar.py --dual-display

      - name: Upload menu bar probe images
        if: ${{ always() && (inputs.menu_bar_probe || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: menu-bar-probe
          path: build/menu-bar-probe/
          if-no-files-found: warn

      - name: Build app + DMG
        run: ./Scripts/build_dmg.sh

      - name: Self-test
        run: ./build/Flux.app/Contents/MacOS/Flux --selftest

      - name: Upload check build
        if: ${{ inputs.menu_bar_probe }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: check-build
          path: build/Flux.dmg
          if-no-files-found: error

      - name: Probe real Flux arrow clicks
        if: ${{ inputs.menu_bar_probe || startsWith(github.ref, 'refs/tags/v') }}
        run: python3 Scripts/probe_menu_bar.py --app-click

      - name: Upload Flux arrow probe images
        if: ${{ always() && (inputs.menu_bar_probe || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flux-arrow-probe
          path: build/menu-bar-probe/
          if-no-files-found: warn

      - name: Render notch snapshots
        run: ./build/Flux.app/Contents/MacOS/Flux --snapshot-notch snapshots all

      - name: Check black notch drawer in both appearances
        timeout-minutes: 3
        run: |
          ./build/Flux.app/Contents/MacOS/Flux --snapshot-notch snapshots/expanded-light.png light expanded
          ./build/Flux.app/Contents/MacOS/Flux --snapshot-notch snapshots/expanded-dark.png dark expanded
          python3 -m venv build/image-probe-env
          build/image-probe-env/bin/python -m pip install --disable-pip-version-check --no-input --timeout 15 --retries 1 Pillow==12.3.0
          build/image-probe-env/bin/python Scripts/probe_notch_black.py snapshots/expanded-light.png snapshots/expanded-dark.png

      - name: Render lock-screen light snapshot
        run: ./build/Flux.app/Contents/MacOS/Flux --snapshot-notch snapshots/lockscreen-light.png light lockscreen

      - name: Render settings snapshots
        run: |
          mkdir -p settings-snapshots
          ./build/Flux.app/Contents/MacOS/Flux --snapshot settings-snapshots/settings-light.png light general
          ./build/Flux.app/Contents/MacOS/Flux --snapshot settings-snapshots/settings-dark.png dark general
          ./build/Flux.app/Contents/MacOS/Flux --snapshot settings-snapshots/lock-screen-dark.png dark lockScreen

      - name: Upload notch snapshots artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notch-snapshots
          path: snapshots/
          if-no-files-found: error

      - name: Upload settings snapshots artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: settings-snapshots
          path: settings-snapshots/
          if-no-files-found: error

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Flux.dmg
          path: build/Flux.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" build/Flux.dmg \
            --title "Flux $VERSION" \
            --generate-notes

      - name: Remove temporary signing keychain
        if: always()
        run: python3 Scripts/import_signing.py --cleanup
